[project]
name = "linkedin-cotlet-mcp"
version = "1.0.0"
description = "Connect LinkedIn to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No LinkedIn API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["linkedin", "linkedin api", "linkedin mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/linkedin-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=linkedin"
Source = "https://github.com/cotlet-connect/linkedin-mcp"

[project.scripts]
linkedin-cotlet-mcp = "linkedin_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"linkedin_agent.py" = "linkedin_agent.py"

[tool.hatch.build.targets.sdist]
include = ["linkedin_agent.py", "README.md", "LICENSE", "mcp.json", "skills", "examples", ".cursor"]
